<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>film, the vertical cut</title>
<link rel="stylesheet" href="stage.css">
<script>window.STAGE_FORMAT = "9x16";</script>   <!-- this file is composed for the 1080 x 1920 frame -->
<script src="data/timing.js"></script>     <!-- word times: node tools/clock.mjs (the same clock as film.html) -->
<script src="data/captions.js"></script>   <!-- captions for the burned-in cut: node tools/captions.mjs -->
<script src="stage.js"></script>
</head><body>
<script>
// The vertical cut: the same script, voice, beats, look and colours as film.html, composed for the tall frame.
// Design this frame from a blank page (references/method.md section 13). Do not copy film.html's layout and move
// its parts: ask what picture this idea wants when the frame is tall, then build that.
// Content lives inside x 72 to 1008, y 200 to 1500 (film.area); a phone app covers the top and the bottom strip.
// Every row of SCRIPT.md's beat sheet happens here too, on the same words.
Stage.film({ look: "paper" }, film => {
  const [p1, p2] = film.paras;

  // ---- 1. (one block per beat of SCRIPT.md's beat sheet)
  const A = film.scene(p1, p2);
  const question = A.text("The question\nthe film\nanswers", { x: 72, y: 220, size: "display" });   // no show(): there from the first frame
  const line = A.text("Short sentences, for the ear.", { x: 76, y: 720, size: "body", color: "muted" }).show(p1.at("written for the ear"));
  const thing = A.box({ x: 72, y: 940, w: 936, h: 420, fill: "panel", stroke: "ink", label: "the thing", labelSize: "head" })
    .show(p1.at("something the viewer can picture"));

  // ---- 2.
  const swap = p2.at("One paragraph is one idea");
  question.hide(swap - 0.2); line.hide(swap - 0.2);
  A.hud.text("The heading", { x: 72, y: 200, size: "head" }).show(swap);
  A.number(10, { x: 540, y: 430, size: 320, align: "center", suffix: " s" }).show(p2.at("twenty-five seconds", -0.4))
    .to(p2.at("twenty-five seconds"), { value: 25 }, { dur: 0.8, ease: "out" });
  thing.to(p2.at("exactly"), { stroke: "accent" }, { dur: 0.4 }).pulse(p2.at("exactly"));
});
</script>
</body></html>
