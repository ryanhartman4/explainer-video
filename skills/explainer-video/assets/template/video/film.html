<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>film</title>
<link rel="stylesheet" href="stage.css">
<script src="data/timing.js"></script>     <!-- word times: node tools/clock.mjs -->
<script src="data/captions.js"></script>   <!-- captions for the burned-in cut: node tools/captions.mjs -->
<script src="stage.js"></script>
</head><body>
<script>
// The film. Open this file in a browser to play and scrub it. API: the skill's references/stage.md.
// Paragraphs (film.paras) say WHEN: p1.at("some words") is the moment the narrator says them.
// Scenes say WHERE: a scene is a layer that lives for one paragraph, or for several when the picture carries on.
Stage.film({ look: "paper" }, film => {
  const [p1, p2] = film.paras;

  // ---- 1. (one block per beat of SCRIPT.md's beat sheet)
  const A = film.scene(p1, p2);                                               // one picture across paragraphs 1 and 2
  const question = A.text("The question\nthe film answers", { x: 120, y: 120, size: "display" });   // no show(): there from the first frame
  const line = A.text("Short sentences, for the ear.", { x: 124, y: 460, size: "body", color: "muted" }).show(p1.at("written for the ear"));
  const thing = A.box({ x: 1240, y: 150, w: 420, h: 180, fill: "panel", stroke: "ink", label: "the thing", labelSize: "body" })
    .show(p1.at("something the viewer can picture"));

  // ---- 2.
  const swap = p2.at("One paragraph is one idea");
  question.hide(swap - 0.2); line.hide(swap - 0.2);
  A.hud.text("The heading", { x: 120, y: 96, size: "head" }).show(swap);
  A.number(10, { x: 120, y: 420, size: "display", suffix: " s" }).show(p2.at("twenty-five seconds", -0.4))
    .to(p2.at("twenty-five seconds"), { value: 25 }, { dur: 0.8, ease: "out" });
  thing.to(p2.at("exactly"), { stroke: "accent" }, { dur: 0.4 }).pulse(p2.at("exactly"));
});
</script>
</body></html>
